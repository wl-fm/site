backend:
  name: github
  repo: wl-fm/site
  branch: main
  base_url: https://wlfm.pages.dev

# Local backend for development - uncomment when testing locally:
# local_backend: true

media_folder: "/Assets/uploads"
public_folder: "/Assets/uploads"

locale: "en"

collections:

  # ── Collections / Products ─────────────────────────────────────
  # Each product gets its OWN asset folder: Assets/Collection/<Product Name>/
  - name: "products"
    label: "Collections"
    folder: "_data/products"
    format: "json"
    extension: "json"
    create: true
    slug: "{{fields.title | slugify}}"
    media_folder: "/Assets/Collection/{{slug}}"
    public_folder: "/Assets/Collection/{{slug}}"
    sortable_fields: ['order', 'title']
    fields:
      - { label: "Product Name", name: "title", widget: "string" }
      - { label: "Anchor / Slug", name: "slug", widget: "string", hint: "Short ID for page anchor, e.g. ayla" }
      - { label: "Display Order", name: "order", widget: "number", value_type: "int", default: 99 }
      - { label: "Category Label (EN)", name: "category_en", widget: "string", hint: "e.g. Sleeveless Boxy Top" }
      - { label: "Category Label (ID)", name: "category_id", widget: "string" }
      - { label: "Description (EN)", name: "description_en", widget: "markdown" }
      - { label: "Description (ID)", name: "description_id", widget: "markdown" }
      - { label: "Second Paragraph / Note (EN)", name: "note_en", widget: "markdown", required: false }
      - { label: "Second Paragraph / Note (ID)", name: "note_id", widget: "markdown", required: false }
      - label: "Details List"
        name: "details"
        widget: "list"
        fields:
          - { label: "Detail (EN)", name: "en", widget: "string" }
          - { label: "Detail (ID)", name: "id", widget: "string" }
      - { label: "Main / Hero Image", name: "main_image", widget: "image" }
      - label: "Gallery Images"
        name: "gallery"
        widget: "list"
        field: { label: "Image", name: "image", widget: "image" }

  # ── Events ────────────────────────────────────────────────────
  - name: "events"
    label: "Events"
    folder: "_data/events"
    format: "json"
    extension: "json"
    create: true
    slug: "{{fields.title_en | slugify}}"
    media_folder: "/Assets/Events"
    public_folder: "/Assets/Events"
    sortable_fields: ['order', 'title_en']
    fields:
      - { label: "Event Title (EN)", name: "title_en", widget: "string" }
      - { label: "Event Title (ID)", name: "title_id", widget: "string" }
      - { label: "Location & Year", name: "meta", widget: "string", hint: "e.g. M Bloc Space, Jakarta • 2026" }
      - { label: "Description (EN)", name: "description_en", widget: "markdown" }
      - { label: "Description (ID)", name: "description_id", widget: "markdown" }
      - { label: "Cover Image", name: "image", widget: "image" }
      - { label: "Display Order", name: "order", widget: "number", value_type: "int", default: 99 }

  # ── FAQ ───────────────────────────────────────────────────────
  - name: "faq"
    label: "FAQ"
    folder: "_data/faq"
    format: "json"
    extension: "json"
    create: true
    slug: "{{fields.question_en | slugify}}"
    sortable_fields: ['order', 'category']
    fields:
      - { label: "Question (EN)", name: "question_en", widget: "string" }
      - { label: "Question (ID)", name: "question_id", widget: "string" }
      - { label: "Answer (EN)", name: "answer_en", widget: "markdown" }
      - { label: "Answer (ID)", name: "answer_id", widget: "markdown" }
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - { label: "Brand & Design Philosophy", value: "brand" }
          - { label: "Craftsmanship & Materials", value: "craftsmanship" }
          - { label: "Sustainability", value: "sustainability" }
          - { label: "Care & Shipping", value: "care" }
      - { label: "Display Order", name: "order", widget: "number", value_type: "int", default: 99 }

  # ── Site Settings ──────────────────────────────────────────────
  - name: "settings"
    label: "Site Settings"
    files:
      - name: "general"
        label: "General Settings"
        file: "_data/settings.json"
        fields:
          - { label: "Site Title (EN)", name: "title_en", widget: "string" }
          - { label: "Site Title (ID)", name: "title_id", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Phone / WhatsApp", name: "phone", widget: "string" }
          - { label: "Instagram Handle", name: "instagram", widget: "string" }
          - { label: "Address (EN)", name: "address_en", widget: "markdown" }
          - { label: "Address (ID)", name: "address_id", widget: "markdown" }

  # ── Pages ─────────────────────────────────────────────────────
  - name: "pages"
    label: "Pages"
    files:
      - name: "about"
        label: "About Page"
        file: "_data/about.json"
        fields:
          - { label: "Story Heading (EN)", name: "story_heading_en", widget: "string" }
          - { label: "Story Heading (ID)", name: "story_heading_id", widget: "string" }
          - { label: "Story Body (EN)", name: "story_en", widget: "markdown" }
          - { label: "Story Body (ID)", name: "story_id", widget: "markdown" }
          - { label: "Story Closing Line (EN)", name: "story_closing_en", widget: "string" }
          - { label: "Story Closing Line (ID)", name: "story_closing_id", widget: "string" }
          - { label: "Vision Heading (EN)", name: "vision_heading_en", widget: "string" }
          - { label: "Vision Heading (ID)", name: "vision_heading_id", widget: "string" }
          - { label: "Vision Text (EN)", name: "vision_en", widget: "markdown" }
          - { label: "Vision Text (ID)", name: "vision_id", widget: "markdown" }
          - { label: "Purpose Heading (EN)", name: "purpose_heading_en", widget: "string" }
          - { label: "Purpose Heading (ID)", name: "purpose_heading_id", widget: "string" }
          - { label: "Purpose Text (EN)", name: "purpose_en", widget: "markdown" }
          - { label: "Purpose Text (ID)", name: "purpose_id", widget: "markdown" }
          - { label: "Hero Image", name: "hero_image", widget: "image" }
